<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ckepi — Planetary Analog Decomposition</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ckepi-theme");
          var isLight =
            t === "light" ||
            (t !== "dark" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (!isLight) document.documentElement.classList.add("dark");
          var l = localStorage.getItem("ckepi-lang");
          if (l === "es" || l === "pt" || l === "en") {
            document.documentElement.lang = l;
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-surface text-content antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
