<p class="sm-readout" data-readout aria-live="polite"><span>Marte · 230 mSv/año (medido) ≈ 96 fichas</span><span>Oscilación día–noche 92,2 °C (Jezero) · un día dura 24 h 39 min (un sol)</span></p></div>
<figcaption class="iso-legend"><span class="sm-keys"><span class="sm-key"><span class="sm-chip" style="background:#E4ED83" aria-hidden="true"></span>Ficha: 2,4 mSv (un año en la Tierra)</span><span class="sm-key"><span class="sm-chip" style="background:#FFF2D7" aria-hidden="true"></span>Capas: atmósfera, a escala de su masa</span><span class="sm-key"><span class="sm-chip" style="background:#E8A080" aria-hidden="true"></span>Bobina: campo magnético global</span><span class="sm-key"><span class="sm-chip" style="background:#183A3A;border-color:#FFF2D7" aria-hidden="true"></span>Índices: máxima y mínima del día</span></span><span class="iso-caption">Una ficha vale 2,4 mSv, la dosis media anual de una persona en la Tierra (UNSCEAR): la Tierra llena 1 ficha en un año, Marte ≈96 (≈230 mSv/año, medido por el instrumento RAD del rover Curiosity, Hassler et al. 2014) y la Luna ≈158 (≈380 mSv/año en mínimo solar y ≈110 en máximo, simulado, Reitz et al. 2012). Las capas sobre el detector son la columna de atmósfera a escala de su masa: Tierra ≈1.033 g/cm², Marte ≈20 g/cm², Luna ninguna; solo la Tierra tiene un campo magnético global. El termómetro marca cuánto sube la temperatura sobre la mínima de la noche: celda 83b224 de Antofagasta 29,7 K (ERA5), Jezero 92,2 K (MEDA) y Shackleton 190,7 K (modelo). Una diferencia vale lo mismo en K y en °C; en °F vale 1,8 veces más. La forma de la curva durante el día es ilustrativa: solo la amplitud es dato. Parecido no es idéntico: la gravedad (0,38 g en Marte, 0,166 g en la Luna) y la presión (0,6 kPa de CO₂ y 0 kPa) tampoco caben en este banco.</span><span class="sm-foot">Datos: Hassler et al. 2014 (MSL RAD) · Reitz et al. 2012 · UNSCEAR · celda 83b224 (ERA5) · Jezero (MEDA) · Shackleton (modelo)</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

  if (state.day.run) return;
  state.day.run = true; state.day.f = 0;
  const s = shape(0); state.day.hi = s; state.day.lo = s;
  run();
}
function pick(w) {
  touring = false;
  state.world = w;
  state.year.run = false; state.year.p = 1 + FALL;
  if (!state.day.run) { state.day.hi = 1; state.day.lo = 0; }
  run();
}
yearBtn.addEventListener("click", () => startYear(false));
dayBtn.addEventListener("click", () => startDay(false));
worldBtns.forEach((b) => b.addEventListener("click", () => pick(b.dataset.world)));
doseBtns.forEach((b) => b.addEventListener("click", () => { touring = false; state.dose = b.dataset.dose; run(); }));
tempBtns.forEach((b) => b.addEventListener("click", () => { touring = false; state.temp = b.dataset.temp; run(); }));
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "80px 0px" }).observe(svg);
still.addEventListener?.("change", () => { if (still.matches) touring = false; run(); });
draw();
</script></body></html>
