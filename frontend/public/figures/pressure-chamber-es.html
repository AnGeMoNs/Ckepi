<figcaption class="iso-legend"><span class="sm-keys"><span class="sm-key"><span class="sm-chip" style="background:#E8A080" aria-hidden="true"></span>Globo, atado a 1014 mbar</span><span class="sm-key"><span class="sm-chip" style="background:#E4ED83" aria-hidden="true"></span>Aguja: presión en la campana</span><span class="sm-key"><span class="sm-chip" style="background:#FFF2D7" aria-hidden="true"></span>Marca: pampa 83b224 (85,8 kPa)</span><span class="sm-key"><span class="sm-chip" style="background:#C1440E" aria-hidden="true"></span>Marca: Marte (6,36 mbar)</span></span><span class="iso-caption">A temperatura constante, la presión por el volumen del aire encerrado en el globo no cambia (ley de Boyle): el volumen crece como 1014 mbar ÷ P. Presión media en la superficie: Tierra 1014 mbar; Marte 6,36 mbar (≈ 0,64 kPa), así que allí el globo tendría que crecer 159 veces; la Luna, con ≈ 3×10⁻¹⁵ bar, es prácticamente vacío. Suponemos que un globo de fiesta revienta al pasar de unas 4 veces su volumen (supuesto ilustrativo; se desprecia la tensión del látex). En la pampa 83b224, a su altura, la presión media es 85,8 kPa: ningún lugar de la Tierra se acerca a Marte, y esa diferencia es parte de la brecha física irreducible entre un análogo y el planeta.</span><span class="sm-foot">Datos: NASA NSSDCA Planetary Fact Sheets (Williams, 2024) · celda 83b224 (NASA POWER / ERA5)</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {

    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

        upper.push(point);

    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {

    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

    let run = null;

        const index = (start + step) % count;
        if (flags[index] === want) {

                run = [index];

function extrude(ring, z, height, projection, options = {}) {

  if (state.phase === "pumping" || state.phase === "venting" || state.phase === "growing") return;
  if (still.matches) { finishInstantly(); draw(); return; }
  state.t = 0; state.runWorld = state.world;
  if (state.p < PR.earth - 0.01 || state.burst) { state.phase = "venting"; state.from = state.p; }
  else state.phase = "pumping";
  run();
}
pumpBtn.addEventListener("click", () => startPump(false));
worldBtns.forEach((b) => b.addEventListener("click", () => { touring = false; state.world = b.dataset.world; if (state.phase === "done") state.phase = "idle"; draw(); }));
unitBtns.forEach((b) => b.addEventListener("click", () => { state.unit = b.dataset.unit; draw(); }));
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "80px 0px" }).observe(svg);
still.addEventListener?.("change", () => { if (still.matches) { touring = false; if (state.phase !== "idle" && state.phase !== "done") finishInstantly(); } run(); });
draw();
</script></body></html>
